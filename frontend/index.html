<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heartbeat Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f5f7fb;
        color: #1f2937;
      }
      h1 {
        margin: 0 0 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }
      th, td {
        padding: 12px 10px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
        font-size: 14px;
      }
      th {
        background: #f3f4f6;
      }
      .status {
        font-weight: bold;
      }
      .up { color: #16a34a; }
      .down { color: #dc2626; }
      .muted { color: #6b7280; }
      input {
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font-size: 14px;
      }
      button {
        padding: 8px 12px;
        border: none;
        background: #2563eb;
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <h1>Heartbeat Monitoring</h1>

    <form id="serviceForm" style="margin: 16px 0 24px; background: #fff; padding: 16px; border: 1px solid #e5e7eb;">
      <strong style="display:block; margin-bottom: 8px;">Add Service</strong>
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;">
        <input id="name" placeholder="Name" required />
        <input id="url" placeholder="https://example.com/health" required />
        <input id="interval" type="number" min="5" value="10" required />
      </div>
      <button style="margin-top: 12px;" type="submit">Add</button>
      <span id="formMsg" class="muted" style="margin-left: 8px;"></span>
    </form>

    <table>
      <thead>
        <tr>
          <th>Service Name</th>
          <th>URL</th>
          <th>Status</th>
          <th>Last Checked</th>
          <th>Response Time (ms)</th>
          <th>Recent Checks</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <script>
      const rows = document.getElementById("rows");
      const serviceForm = document.getElementById("serviceForm");
      const formMsg = document.getElementById("formMsg");

      function formatDate(dt) {
        if (!dt) return "-";
        return new Date(dt).toLocaleString();
      }

      function formatRecent(recent) {
        if (!recent || recent.length === 0) return "-";
        return recent.map(r => `${r.status} ${r.responseTime}ms`).join(" | ");
      }

      async function load() {
        const res = await fetch("/api/dashboard");
        const data = await res.json();

        rows.innerHTML = data
          .map(({ service, last, recent }) => {
            const status = last?.status || "DOWN";
            const statusClass = status === "UP" ? "up" : "down";
            return `
              <tr>
                <td>${service.name}</td>
                <td>${service.url}</td>
                <td class="status ${statusClass}">${status}</td>
                <td class="muted">${formatDate(last?.checkedAt)}</td>
                <td>${last?.responseTime ?? "-"}</td>
                <td class="muted">${formatRecent(recent)}</td>
                <td>
                  <button data-delete-id="${service._id}" style="background:#dc2626;">Delete</button>
                </td>
              </tr>
            `;
          })
          .join("");

        rows.querySelectorAll("button[data-delete-id]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = btn.getAttribute("data-delete-id");
            if (!id) return;
            const ok = confirm("Delete this service?");
            if (!ok) return;
            btn.disabled = true;
            try {
              const res = await fetch(`/api/services/${id}`, { method: "DELETE" });
              if (!res.ok) {
                alert("Failed to delete service");
              }
            } catch (err) {
              alert("Failed to delete service");
            } finally {
              load();
            }
          });
        });
      }

      serviceForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        formMsg.textContent = "Saving...";
        const payload = {
          name: document.getElementById("name").value.trim(),
          url: document.getElementById("url").value.trim(),
          interval: Number(document.getElementById("interval").value),
        };
        try {
          const res = await fetch("/api/services", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (!res.ok) {
            const err = await res.json();
            formMsg.textContent = err.error || "Failed to add service";
            return;
          }
          formMsg.textContent = "Added!";
          serviceForm.reset();
          document.getElementById("interval").value = 10;
          load();
        } catch (err) {
          formMsg.textContent = "Failed to add service";
        }
      });

      load();
      setInterval(load, 5000);
    </script>
  </body>
</html>
